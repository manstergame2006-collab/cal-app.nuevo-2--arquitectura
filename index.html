<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAL.APP - Álgebra, Matrices y Cálculo</title>
  <link rel="stylesheet" href="style.css">
  <script src="plotly.min.js"></script>
  <script src="math.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Encabezado principal -->
  <header class="top-header">
    <div class="header-spacer"></div>
    <h1>CAL.APP</h1>
    <div class="status-bar">
      <span id="estado-red" class="pill online">● En línea</span>
      <button type="button" id="btn-toggle-historial" class="btn-hist">Historial (0)</button>
    </div>
  </header>

  <!-- Navegación por pestañas -->
  <nav class="tabs-bar">
    <button type="button" class="tab-btn active" data-tab="tab-algebra">Álgebra y Cálculo Visual</button>
    <button type="button" class="tab-btn" data-tab="tab-matrices">Calculadora de Matrices</button>
    <button type="button" class="tab-btn" data-tab="tab-aritmetica">Calculadora Aritmética</button>
    <button type="button" class="tab-btn" data-tab="tab-historial">Historial</button>
  </nav>

  <!-- SECCIÓN 1: ÁLGEBRA Y CÁLCULO VISUAL -->
  <main id="tab-algebra" class="workspace active">
    <aside class="control-panel">
      <div class="form-group">
        <label for="modulo-select">Seleccione Herramienta:</label>
        <select id="modulo-select">
          <option value="integral" selected>Integral definida (2D/3D)</option>
          <option value="volumen">Volumen Discos (2D/3D)</option>
          <option value="parametrica">Ecuaciones Paramétricas (2D/3D)</option>
          <option value="area">Área entre Curvas (2D/3D)</option>
          <option value="cascarones">Cascarones Cilíndricos (2D/3D)</option>
          <option value="curvas">Curvas de Nivel f(x,y) (2D/3D)</option>
          <option value="campo">Campo Vectorial (2D/3D)</option>
        </select>
      </div>

      <!-- Contenedor donde script.js inserta f(x), Límite a, Límite b y 2D/3D/Dual -->
      <div id="input-frame" class="dynamic-inputs"></div>

      <button type="button" id="btnGenerarGrafico" class="btn-primary">GENERAR GRÁFICO</button>

      <textarea id="res-txt" class="results-box" readonly placeholder="Resultados numéricos..."></textarea>
    </aside>

    <section class="canvas-panel">
      <div id="plot-div" style="width: 100%; height: 100%; min-height: 450px;"></div>
    </section>
  </main>

  <!-- SECCIÓN 2: CALCULADORA DE MATRICES (CUADRADAS Y ASIMÉTRICAS) -->
  <main id="tab-matrices" class="workspace hidden">
    <aside class="control-panel">
      <div class="form-group">
        <label>Dimensiones Matriz A (Filas × Cols):</label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="number" id="mat-a-filas" value="2" min="1" max="6" style="width: 60px;">
          <span>×</span>
          <input type="number" id="mat-a-cols" value="3" min="1" max="6" style="width: 60px;">
        </div>
      </div>

      <div class="form-group">
        <label>Dimensiones Matriz B (Filas × Cols):</label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="number" id="mat-b-filas" value="3" min="1" max="6" style="width: 60px;">
          <span>×</span>
          <input type="number" id="mat-b-cols" value="2" min="1" max="6" style="width: 60px;">
        </div>
      </div>

      <button type="button" id="btn-crear-grids" class="btn-secondary" style="margin-bottom: 12px;">Actualizar Cuadrículas</button>

      <div class="form-group">
        <label for="op-matriz">Operación Matricial:</label>
        <select id="op-matriz">
          <option value="suma">Suma (A + B)</option>
          <option value="mult" selected>Multiplicación (A × B)</option>
          <option value="det">Determinante de A (Cuadrada)</option>
          <option value="antisimetrica">Transpuesta y Verificar Antisimétrica (Aᵀ = -A)</option>
        </select>
      </div>

      <button type="button" id="btn-calc-matriz" class="btn-primary">CALCULAR MATRIZ</button>
    </aside>

    <section class="canvas-panel center-content" style="flex-direction: column; gap: 15px;">
      <div class="matrix-grids-container" style="display: flex; gap: 30px; flex-wrap: wrap;">
        <div>
          <h4>Matriz A</h4>
          <div id="grid-a"></div>
        </div>
        <div>
          <h4>Matriz B</h4>
          <div id="grid-b"></div>
        </div>
      </div>
      <pre id="matrix-res" class="matrix-display">Ajusta las dimensiones, llena las celdas y presiona calcular.</pre>
    </section>
  </main>

    <!-- SECCIÓN 3: CALCULADORA ARITMÉTICA -->
  <main id="tab-aritmetica" class="workspace hidden">
    <aside class="control-panel">
      <h3 class="panel-title" style="margin-top: 0;">Calculadora de Operandos Múltiples</h3>

      <div id="arit-inputs" class="form-group" style="display: flex; flex-direction: column; gap: 10px;">
        <input type="number" placeholder="Num 1" autocomplete="off">
        <input type="number" placeholder="Num 2" autocomplete="off">
        <input type="number" placeholder="Num 3" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="arit-op">Operación (+, -, *, /):</label>
        <input type="text" id="arit-op" maxlength="1" placeholder="+" style="width: 70px; text-align: center; font-weight: bold;" autocomplete="off">
      </div>

      <button type="button" id="btn-calc-arit" class="btn-primary">CALCULAR</button>
      <div id="arit-result" class="results-box">Resultado: ---</div>
    </aside>
  </main>


  <!-- SECCIÓN 4: PESTAÑA DE HISTORIAL -->
  <main id="tab-historial" class="workspace hidden">
    <section class="canvas-panel" style="width: 100%; max-width: 800px; margin: 0 auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 class="panel-title" style="margin: 0;">Historial de Operaciones Locales</h3>
        <button type="button" id="btn-limpiar-historial" onclick="limpiarHistorial()" class="btn-primary" style="width: auto; padding: 6px 14px; background: #dc2626;">Limpiar</button>
      </div>
      <ul id="lista-historial" class="history-list"></ul>
    </section>
  </main>

  <!-- Cajón lateral desplegable de Historial -->
  <div id="drawer-historial" class="drawer hidden">
    <div class="drawer-header">
      <h3>Historial Sincronizado</h3>
      <button type="button" id="btn-cerrar-drawer">✕</button>
    </div>
    <ul id="lista-historial-global" class="history-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
